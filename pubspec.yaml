name: code_bridge_mini
description: Portable desktop tool for turning AI responses and ZIP archives into Flutter project files and pushing them to GitHub.
publish_to: 'none'
version: 2.1.54+54

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0 <3.25.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  path: ^1.9.0
  file_picker: ^8.1.2
  window_manager: ^0.4.3
  tray_manager: ^0.5.3
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
