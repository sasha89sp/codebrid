name: PR Checks

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  docs-analyze-test:
    name: Docs, Analyze and Test
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify required documentation files
        shell: pwsh
        run: |
          $required = @('AGENTS.md', 'ROOT_MAP.md', 'MAP.md', 'HANDOFF.yaml')
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Missing required documentation file: $file"
            }
          }

      - name: Install Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub
