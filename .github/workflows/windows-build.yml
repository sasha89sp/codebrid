name: Build CodeBridge Mini (Windows x64)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build portable Windows x64
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Enable Windows desktop target
        run: flutter config --enable-windows-desktop

      - name: Show toolchain versions
        run: |
          flutter --version
          flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

      - name: Build Windows release
        run: flutter build windows --release --no-pub

      - name: Package portable ZIP
        shell: pwsh
        run: ./build_portable.ps1

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: CodeBridgeMini-Windows-x64
          path: portable/CodeBridgeMini-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: portable/CodeBridgeMini-Windows-x64.zip
          generate_release_notes: true
